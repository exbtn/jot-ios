<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exbtn</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5b5b5b;
    --border: #e2e2e2;
    --accent: #3b5bfd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #eaeaea;
      --muted: #a3a3ad;
      --border: #2a2b32;
      --accent: #7d9bff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  main {
    max-width: 480px;
    width: 100%;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    margin: 0 0 28px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }
  li {
    border-bottom: 1px solid var(--border);
  }
  a {
    display: block;
    padding: 12px 0;
    color: var(--accent);
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <h1>exbtn</h1>
  <p>Jot — a personal-memory app for iOS.</p>
  <ul>
    <li><a href="/privacy/">Privacy Policy</a></li>
    <li><a href="/terms/">Terms of Use</a></li>
    <li><a href="/support/">Support</a></li>
  </ul>
</main>
</body>
</html>
