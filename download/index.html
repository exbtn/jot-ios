<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ff">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Jot — Save everything. Ask anything.">
<meta property="og:description" content="Your personal memory vault for iPhone.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://exbtn.github.io/jot-ios/download/">
<title>Download Jot for iPhone</title>
<style>
  :root {
    color-scheme: light;
    --background: #f4f2ff;
    --surface: rgba(255, 255, 255, 0.72);
    --text: #17151f;
    --muted: #625f6d;
    --button: #17151f;
    --button-text: #ffffff;
    --ring: rgba(88, 69, 196, 0.22);
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 15%, rgba(155, 133, 255, 0.27), transparent 34rem),
      radial-gradient(circle at 85% 82%, rgba(112, 218, 255, 0.22), transparent 30rem),
      var(--background);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
  }

  .card {
    width: min(100%, 440px);
    padding: 42px 30px 34px;
    border: 1px solid rgba(255, 255, 255, 0.88);
    border-radius: 32px;
    background: var(--surface);
    box-shadow: 0 24px 70px rgba(36, 29, 74, 0.14);
    text-align: center;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }

  .icon {
    width: 92px;
    height: 92px;
    display: grid;
    place-items: center;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: linear-gradient(145deg, #6e5ae6, #3b2c9b);
    box-shadow: 0 15px 34px rgba(73, 55, 172, 0.3);
    color: #fff;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.08em;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.25rem, 10vw, 3.25rem);
    line-height: 0.98;
    letter-spacing: -0.055em;
  }

  .tagline {
    margin: 18px auto 30px;
    color: var(--muted);
    font-size: 1.08rem;
    line-height: 1.5;
  }

  .store-link {
    min-height: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 13px 22px;
    border-radius: 16px;
    background: var(--button);
    box-shadow: 0 9px 24px rgba(23, 21, 31, 0.2);
    color: var(--button-text);
    text-decoration: none;
    transition: transform 150ms ease, box-shadow 150ms ease;
  }

  .store-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(23, 21, 31, 0.24);
  }

  .store-link:active { transform: scale(0.985); }

  .store-link:focus-visible {
    outline: 4px solid var(--ring);
    outline-offset: 3px;
  }

  .store-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }

  .store-copy small {
    margin-bottom: 4px;
    font-size: 0.68rem;
    letter-spacing: 0.01em;
  }

  .store-copy strong {
    font-size: 1.28rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .status {
    min-height: 20px;
    margin: 17px 0 0;
    color: var(--muted);
    font-size: 0.84rem;
  }

  footer {
    margin-top: 26px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .store-link { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <div class="icon" aria-hidden="true">J</div>
    <h1 id="title">Jot</h1>
    <p class="tagline">Save everything.<br>Ask anything.</p>

    <a class="store-link" id="store-link" href="https://apps.apple.com/app/id6790188519">
      <span class="store-copy">
        <small>Download on the</small>
        <strong>App Store</strong>
      </span>
    </a>

    <p class="status" id="status" aria-live="polite"></p>

    <footer>
      Available for iPhone · <a href="../privacy/">Privacy</a> · <a href="../support/">Support</a>
    </footer>
  </section>
</main>

<noscript>
  <style>.status::after { content: "Tap the App Store button to download Jot."; }</style>
</noscript>

<script>
  (function () {
    "use strict";

    var appStoreURL = "https://apps.apple.com/app/id6790188519";
    var nativeAppStoreURL = "itms-apps://apps.apple.com/app/id6790188519";
    var userAgent = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var storeLink = document.getElementById("store-link");
    var status = document.getElementById("status");

    // Preserve campaign parameters when handing off to Apple's HTTPS page.
    if (window.location.search) {
      appStoreURL += window.location.search;
    }
    storeLink.href = appStoreURL;

    function openAppStore(event) {
      if (!isIOS) return;
      if (event) event.preventDefault();

      status.textContent = "Opening the App Store…";
      window.location.href = nativeAppStoreURL;

      // If an in-app browser blocks the native scheme, use Apple's web URL.
      window.setTimeout(function () {
        if (!document.hidden) window.location.replace(appStoreURL);
      }, 1200);
    }

    storeLink.addEventListener("click", openAppStore);

    if (isIOS) {
      status.textContent = "Opening the App Store…";
      window.setTimeout(openAppStore, 120);
    } else {
      status.textContent = "Jot is currently available for iPhone.";
    }
  }());
</script>
</body>
</html>
